# Base44 dev environment — static single-page app served directly from source.
services:
  web:
    image: nginx:alpine
    restart: on-failure
    ports:
      - "3000:80"
    volumes:
      # Serve the cloned source directly — edits to index.html appear on reload.
      - .:/usr/share/nginx/html:ro
    # The sandbox repo dir is root-only (0700); nginx workers must run as root to read it.
    command: ["sh", "-c", "sed -i 's/^user .*;/user root;/' /etc/nginx/nginx.conf && exec nginx -g 'daemon off;'"]
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -qO- http://127.0.0.1:80/ >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
